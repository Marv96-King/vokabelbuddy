<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>VokabelBuddy</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f3f4f6;
  color:#111827
}
header{
  background:#111827;
  color:white;
  padding:22px 18px;
  border-radius:0 0 24px 24px
}
header h1{margin:0;font-size:28px}
header p{margin:5px 0 0;opacity:.7}
main{max-width:760px;margin:auto;padding:16px}
.card{
  background:white;
  padding:18px;
  border-radius:18px;
  box-shadow:0 4px 18px #0001;
  margin-bottom:14px
}
button{
  width:100%;
  border:0;
  border-radius:15px;
  padding:14px;
  font-size:16px;
  font-weight:700;
  background:#111827;
  color:white;
  cursor:pointer
}
button:disabled{opacity:.6}
.secondary{background:#e5e7eb;color:#111827}
.danger{background:#fee2e2;color:#991b1b}
input,select,textarea{
  width:100%;
  padding:13px;
  border:1px solid #d1d5db;
  border-radius:14px;
  font-size:16px;
  background:white
}
textarea{min-height:130px;resize:vertical}
.field{margin-bottom:12px}
.login{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px
}
.login-card{width:100%;max-width:430px}
.logo{text-align:center;font-size:60px}
.title{text-align:center;font-size:28px;font-weight:800}
.sub{text-align:center;color:#6b7280;margin-bottom:25px}
.message{
  display:none;
  margin-top:12px;
  padding:12px;
  border-radius:12px;
  font-size:14px;
  white-space:pre-wrap
}
.error{display:block;background:#fee2e2;color:#991b1b}
.success{display:block;background:#dcfce7;color:#166534}
.hidden{display:none}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px
}
.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px
}
.stat{font-size:26px;font-weight:800}
.muted{font-size:13px;color:#6b7280}
section{display:none}
section.active{display:block}
.word{
  text-align:center;
  font-size:34px;
  font-weight:800;
  margin:28px 0 8px
}
.answer{
  text-align:center;
  min-height:32px;
  color:#6b7280;
  font-size:20px
}
.item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:13px 0;
  border-bottom:1px solid #eee
}
.item:last-child{border-bottom:0}
.item button{width:auto;padding:9px 12px}
@media(max-width:500px){
  .word{font-size:29px}
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginScreen" class="login">

  <div class="card login-card">

    <div class="logo">📚</div>

    <div class="title">VokabelBuddy</div>

    <div class="sub">
      Jelly · Englisch & Französisch
    </div>

    <div class="field">
      <input
        id="email"
        type="email"
        placeholder="E-Mail"
        autocomplete="email">
    </div>

    <div class="field">
      <input
        id="password"
        type="password"
        placeholder="Passwort"
        autocomplete="current-password">
    </div>

    <button id="loginButton" onclick="login()">
      🔐 Einloggen
    </button>

    <div id="loginMessage" class="message"></div>

  </div>

</div>


<!-- APP -->
<div id="app" class="hidden">

<header>
  <h1>📚 VokabelBuddy</h1>
  <p>👦 Jelly · Englisch & Französisch</p>
</header>

<main>

<div class="card">

  <div class="muted">Angemeldet als</div>

  <div id="userEmail" style="font-weight:700;margin:4px 0 12px"></div>

  <button class="secondary" onclick="logout()">
    Abmelden
  </button>

</div>


<div class="stats">

  <div class="card">
    <div class="muted">🔥 Streak</div>
    <div id="streak" class="stat">0</div>
  </div>

  <div class="card">
    <div class="muted">⭐ XP</div>
    <div id="xp" class="stat">0</div>
  </div>

</div>


<div class="grid" style="margin-bottom:14px">

  <button onclick="showSection('learn')">
    🎯 Lernen
  </button>

  <button class="secondary" onclick="showSection('add')">
    ➕ Vokabeln
  </button>

  <button class="secondary" onclick="showSection('list')">
    📚 Meine Wörter
  </button>

  <button class="secondary" onclick="showSection('parent')">
    👨‍👩‍👦 Eltern
  </button>

</div>


<!-- LERNEN -->
<section id="learn" class="active">

<div class="card">

  <select id="learnLang" onchange="startLearning()">
    <option value="en">🇬🇧 Englisch</option>
    <option value="fr">🇫🇷 Französisch</option>
  </select>

  <div id="count" class="muted" style="text-align:center;margin-top:10px">
    0 Wörter
  </div>

  <div id="question" class="word">
    Noch keine Vokabeln
  </div>

  <div id="answer" class="answer"></div>

  <div class="grid" style="margin-top:20px">

    <button onclick="reveal()">
      👀 Lösung
    </button>

      🤔 Schwer
